name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * 1"   # Mondays: the sources still resolve (datasets renamed, fields changed, gated)
  workflow_dispatch:

jobs:
  lint:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python syntax
        run: git ls-files '*.py' | while read -r f; do python -m py_compile "$f" || exit 1; done
      - name: Ruff
        run: |
          python -m pip install -q ruff==0.12.0
          ruff check .
      - name: Shell syntax and ShellCheck (errors)
        run: |
          for f in bin/mmb install.sh; do bash -n "$f" || exit 1; done
          shellcheck -S error bin/mmb install.sh

  tests:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -q -r requirements.txt
      - name: Scoring, item build, mock endpoint end to end, report
        run: MMB_PYTHON=python bin/mmb test
      - name: Command line
        run: |
          MMB_PYTHON=python bin/mmb list | grep -q timeblind
          ! MMB_PYTHON=python bin/mmb run 2>/dev/null   # refuses without MODEL / OPENAI_BASE_URL / OPENAI_API_KEY

  secrets:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # every commit, not just the last one
      - name: gitleaks
        env:
          GITLEAKS_VERSION: 8.21.2
        run: |
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar -xz gitleaks
          ./gitleaks git . --config .gitleaks.toml --redact --verbose

  sources:   # weekly and on demand: every source still gives its items (metadata only, nothing downloaded)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dry run of every source
        run: MMB_PYTHON=python MMB_HOME=$RUNNER_TEMP bin/mmb build --dry-run --strict
